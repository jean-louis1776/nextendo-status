name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, for example 0.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64
    steps:
      - uses: actions/checkout@v4

      - name: Install libraries
        run: |
          # pkg.devkitpro.org often returns 403 to Actions. Prefer curl with a
          # normal browser UA; fall back to wget + dkp-pacman UA.
          if ! command -v curl >/dev/null || ! command -v wget >/dev/null; then
            apt-get update && apt-get install -y curl wget
          fi
          conf=/opt/devkitpro/pacman/etc/pacman.conf
          pkgs='switch-sdl2 switch-sdl2_ttf switch-libjpeg-turbo switch-curl switch-mbedtls switch-mesa switch-bzip2 switch-libpng switch-freetype switch-zlib'
          ok=0
          for xfer in \
            '/usr/bin/curl -A "Mozilla/5.0" -fL --retry 5 --retry-delay 2 -o %o %u' \
            '/usr/bin/wget -U "dkp-pacman" --passive-ftp -c -O %o %u'
          do
            sed -i '/^XferCommand/d' "$conf"
            sed -i "/^\[options\]/a XferCommand = $xfer" "$conf"
            rm -f /opt/devkitpro/pacman/var/lib/pacman/sync/dkp-* /var/lib/pacman/sync/dkp-*
            for n in 1 2 3 4 5 6; do
              if dkp-pacman -Syu --noconfirm $pkgs; then
                ok=1
                break 2
              fi
              sleep $((n * 4))
            done
          done
          test "$ok" = 1

      - name: Build
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            make -j"$(nproc)" APP_VERSION="${{ inputs.version }}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            make -j"$(nproc)" APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            make -j"$(nproc)"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nexstatus-switch
          path: |
            nexstatus.zip
            app/nexstatus.nro

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      # sdkmanager does not publish platforms;android-37 on runners yet, but Compose/haze require compileSdk 37.
      - name: Provide android-37 platform
        run: |
          set -e
          SRC="${ANDROID_HOME}/platforms/android-36"
          DST="${ANDROID_HOME}/platforms/android-37"
          test -d "$SRC"
          rm -rf "$DST"
          cp -a "$SRC" "$DST"
          sed -i 's/AndroidVersion.ApiLevel=36/AndroidVersion.ApiLevel=37/' "$DST/source.properties"
          if [ -f "$DST/package.xml" ]; then
            sed -i 's/android-36/android-37/g; s/>36</>37</g' "$DST/package.xml" || true
          fi
          grep -n "ApiLevel" "$DST/source.properties"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk nexstatus.apk
          python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path("app/build.gradle.kts").read_text()
          m = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          pathlib.Path("android-version.txt").write_text(m.group(1) if m else "0", encoding="utf-8")
          print("android-version:", pathlib.Path("android-version.txt").read_text())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nexstatus-android
          path: |
            android/nexstatus.apk
            android/android-version.txt

  publish:
    if: github.ref_type == 'tag'
    needs: [build-switch, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nexstatus-switch
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: nexstatus-android
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: |
            dist/nexstatus.zip
            dist/nexstatus.nro
            dist/nexstatus.apk
            dist/android-version.txt
          body: |
            ## What's new

            Switch homebrew and the Ultrahand overlay are 1.2.0.

            - The overlay lists the same servers as the homebrew app. Only games with at least one player are shown.
            - **A** on a game shows the player count, lobbies with the mode name, and every player. **A** on a lobby shows who is in that room.
            - **Refresh** reloads the list or the open game. Nothing reloads on its own.
            - Signed out, **A** explains how to sign in through the NexStatus homebrew app from the Homebrew Menu.

            Set Ultrahand **Overlay memory** to **8 MB** before opening the overlay. The 4 MB default is too small and can fail to load the overlay or crash Atmosphere.

            ## Switch
            Extract `nexstatus.zip` at the root of the SD card.

            ## Android
            Install `nexstatus.apk`. This release keeps the Android app at 1.1.6. It shows the same public server counts and, after sign-in, lobbies and players. It checks GitHub for a newer APK on launch.
          generate_release_notes: true
          fail_on_unmatched_files: false
