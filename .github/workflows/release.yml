name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, for example 0.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64
    steps:
      - uses: actions/checkout@v4

      - name: Install libraries
        run: |
          cat >> /opt/devkitpro/pacman/etc/pacman.conf << 'EOF'
          XferCommand = /usr/bin/curl -A "Mozilla/5.0" -L --retry 5 --retry-delay 2 -f -C - -o %o %u
          EOF
          ok=0
          for _ in 1 2 3 4 5; do
            if dkp-pacman -Syu --noconfirm switch-sdl2 switch-sdl2_ttf switch-libjpeg-turbo switch-curl switch-mbedtls switch-mesa switch-bzip2 switch-libpng switch-freetype switch-zlib; then
              ok=1
              break
            fi
            sleep 8
          done
          test "$ok" = 1

      - name: Build
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            ver="${{ inputs.version }}"
          else
            ver="${GITHUB_REF_NAME#v}"
          fi
          make -j"$(nproc)" APP_VERSION="$ver"

      - uses: actions/upload-artifact@v4
        with:
          name: nexstatus
          path: |
            nexstatus.zip
            app/nexstatus.nro

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nexstatus

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: |
            nexstatus.zip
            nexstatus.nro
          generate_release_notes: true
